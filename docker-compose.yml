services:
  pedidos:
    build: .
    ports:
      - "8000:8000"   # única porta publicada
    environment:
      DATABASE_URL: postgresql+psycopg2://pedidos:pedidos@postgres:5432/pedidos
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rede-pedidos

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
      POSTGRES_DB: pedidos
    volumes:
      - dados-postgres:/var/lib/postgresql/data   # persistência: dado sobrevive a restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rede-pedidos

volumes:
  dados-postgres:

networks:
  rede-pedidos: